
services:
  catalog:
    build:
      context: ./catalog_service
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      DB_PATH: /data/catalog.db
    volumes:
      - catalog-data:/data

  order:
    build:
      context: ./order_service
    ports:
      - "5002:5002"
    environment:
      CATALOG_URL: http://catalog:5001
      ORDER_DB_PATH: /app/data/orders.db
    volumes:
      - order-data:/app/data
    depends_on:
      - catalog

  frontend:
    build:
      context: ./frontend_service
    ports:
      - "5000:5000"
    environment:
      CATALOG_URL: http://catalog:5001
      ORDER_URL: http://order:5002
    depends_on:
      - catalog
      - order

volumes:
  catalog-data:
  order-data:
